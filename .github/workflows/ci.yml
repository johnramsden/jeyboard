# Runs the same checks as `make test`, `make shell-test` and the .deb build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    # The pure modules need only gjs (>= 1.68 for `gjs -m`); Ubuntu 24.04 ships 1.80.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: make test
        run: make test

  package:
    # Builds the .deb (its dh_auto_test step runs `make test` again) and the EGO zip,
    # and checks the zip never contains a compiled schema. Runs on Ubuntu 26.04, the
    # distro the package targets. (ubuntu-26.04 is a GitHub "preview" image.)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts gjs zip
      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Build the zip and check its contents
        run: |
          make zip
          unzip -l jeyboard@johnramsden.ca.shell-extension.zip
          ! unzip -l jeyboard@johnramsden.ca.shell-extension.zip | grep -q gschemas.compiled

  shell-test:
    # Headless gnome-shell test (tests/shell/smoke.js). Needs gnome-shell 50, which only
    # Ubuntu 26.04 ships. NOT yet verified on GitHub Actions (it passes locally on
    # gnome-shell 50.1); continue-on-error keeps a CI-environment problem from failing
    # the build until it has been seen green. Remove that line then.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gjs make zip dbus
      - name: Prepare the runtime directory the shell expects
        run: |
          sudo mkdir -p /run/user/$(id -u)
          sudo chown $(id -u):$(id -g) /run/user/$(id -u)
          chmod 700 /run/user/$(id -u)
      - name: make shell-test
        run: make shell-test
      - name: Show the log on failure
        if: failure()
        run: tail -n 100 shell-test.log
